<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>AR 3D Scene GLTF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #enter-ar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <button id="enter-ar">Masuk ke Mode AR</button>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
      import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js";
      import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/webxr/ARButton.js";

      let camera, scene, renderer, controller, reticle;
      let model = null;

      init();
      animate();

      function init() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          0.01,
          20
        );

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Cahaya lembut
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // Reticle (penanda lantai)
        const geometry = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(geometry, material);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // Controller untuk tap
        controller = renderer.xr.getController(0);
        controller.addEventListener("select", onSelect);
        scene.add(controller);

        // Tombol AR manual
        document.getElementById("enter-ar").addEventListener("click", () => {
          document.body.appendChild(
            ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] })
          );
          document.getElementById("enter-ar").style.display = "none";
        });

        // Loader GLTF
        const loader = new GLTFLoader();
        loader.load(
          "scene.gltf",
          (gltf) => {
            model = gltf.scene;
            model.scale.set(0.3, 0.3, 0.3); // atur sesuai kebutuhan
            model.visible = false;
            scene.add(model);
            console.log("✅ scene.gltf berhasil dimuat");
          },
          undefined,
          (err) => {
            console.error("❌ Gagal memuat scene.gltf:", err);
          }
        );

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      let hitTestSource = null;

      function onSelect() {
        if (reticle.visible && model) {
          model.position.setFromMatrixPosition(reticle.matrix);
          model.visible = true;
        }
      }

      renderer.setAnimationLoop((timestamp, frame) => {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (!hitTestSource) {
            session.requestReferenceSpace("viewer").then((space) => {
              session.requestHitTestSource({ space }).then((source) => {
                hitTestSource = source;
              });
            });

            session.addEventListener("end", () => {
              hitTestSource = null;
            });
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
              const hit = hitTestResults[0];
              reticle.visible = true;
              reticle.matrix.fromArray(
                hit.getPose(referenceSpace).transform.matrix
              );
            } else {
              reticle.visible = false;
            }
          }
        }
        renderer.render(scene, camera);
      });

      function animate() {
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });
      }
    </script>
  </body>
</html>
