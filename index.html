<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR 3D Model dengan Deteksi Lantai</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-family: sans-serif;
      display: none;
      z-index: 10;
    }
    #arButton {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      font-family: sans-serif;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 10;
      display: none;
    }
    #arButton:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <div id="notification">🚫 Tidak ada lantai terdeteksi</div>
  <button id="arButton">Masuk ke Mode AR</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/webxr/ARButton.js"></script>

  <script>
    let camera, scene, renderer;
    let reticle, controller, model = null;
    const notification = document.getElementById('notification');
    const customARButton = document.getElementById('arButton');

    init();

    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Cahaya
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(0, 1, 0);
      scene.add(dirLight);

      // Reticle
      const ringGeo = new THREE.RingGeometry(0.1, 0.15, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Controller
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // Tombol AR
      if (navigator.xr) {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (supported) {
          customARButton.style.display = 'block';
          customARButton.addEventListener('click', startAR);
        } else {
          customARButton.textContent = 'AR tidak didukung';
          customARButton.style.background = 'gray';
          customARButton.style.display = 'block';
        }
      }

      window.addEventListener('resize', onWindowResize);
    }

    function startAR() {
      navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['dom-overlay'],
        optionalFeatures: ['hit-test'],
        domOverlay: { root: document.body }
      }).then(session => {
        renderer.xr.setSession(session);

        // Debug cube
        const testBox = new THREE.Mesh(
          new THREE.BoxGeometry(0.1, 0.1, 0.1),
          new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        testBox.position.set(0, 0, -0.5);
        scene.add(testBox);

        animate();
      });
    }

    function onSelect() {
      if (reticle.visible) {
        if (!model) {
          const loader = new THREE.GLTFLoader();
          loader.load(
            './model.glb',
            (gltf) => {
              console.log('✅ Model berhasil dimuat');
              model = gltf.scene;
              model.scale.set(0.01, 0.01, 0.01);
              model.position.setFromMatrixPosition(reticle.matrix);
              scene.add(model);
              notification.style.display = 'none';
            },
            undefined,
            (err) => {
              console.error('❌ Gagal memuat model:', err);
              alert('Gagal memuat model 3D!');
            }
          );
        } else {
          model.position.setFromMatrixPosition(reticle.matrix);
        }
      }
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then(refSpace => {
            session.requestHitTestSource({ space: refSpace }).then(source => hitTestSource = source);
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const results = frame.getHitTestResults(hitTestSource);
          if (results.length) {
            const hit = results[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            notification.style.display = 'none';
          } else {
            reticle.visible = false;
            notification.style.display = 'block';
          }
        }
      }
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
