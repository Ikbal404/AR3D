<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AR 3D Model - scene.gltf</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      #info {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 5;
        white-space: pre-line;
      }

      #notification {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 10px;
        display: none;
        z-index: 10;
      }

      #arButton {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px 26px;
        font-size: 16px;
        cursor: pointer;
        font-family: sans-serif;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        z-index: 10;
        display: none;
      }

      #arButton:hover {
        background-color: #0056b3;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="info">
      WebXR: cek...
      <br />
      Kamera: cek...
      <br />
      Model: belum dimuat
    </div>
    <div id="notification">🚫 Tidak ada lantai terdeteksi</div>
    <button id="arButton">Masuk ke Mode AR</button>

    <!-- Three.js & WebXR -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/webxr/ARButton.js"></script>

    <script>
      let camera, scene, renderer;
      let reticle, controller;
      let model = null;
      let hitTestSource = null;
      let hitTestSourceRequested = false;

      const info = document.getElementById("info");
      const notification = document.getElementById("notification");
      const customARButton = document.getElementById("arButton");

      init();

      async function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          0.01,
          20
        );

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        const ringGeo = new THREE.RingGeometry(0.1, 0.15, 32).rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(ringGeo, ringMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        controller = renderer.xr.getController(0);
        controller.addEventListener("select", onSelect);
        scene.add(controller);

        if (navigator.xr) {
          const supported = await navigator.xr.isSessionSupported("immersive-ar");
          if (supported) {
            customARButton.style.display = "block";
            customARButton.addEventListener("click", startAR);
            info.innerText = "WebXR: supported\nKamera: cek...\nModel: belum dimuat";
          } else {
            customARButton.textContent = "AR tidak didukung";
            customARButton.style.background = "gray";
            customARButton.style.display = "block";
            info.innerText = "WebXR: tidak didukung";
          }
        } else {
          customARButton.textContent = "Browser tidak mendukung WebXR";
          customARButton.style.background = "gray";
          customARButton.style.display = "block";
          info.innerText = "WebXR: tidak tersedia";
        }

        window.addEventListener("resize", onWindowResize);
      }

      function startAR() {
        navigator.xr
          .requestSession("immersive-ar", {
            requiredFeatures: ["hit-test", "dom-overlay"],
            domOverlay: { root: document.body },
          })
          .then((session) => {
            renderer.xr.setSession(session);
            animate();
          });
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onSelect() {
        if (reticle.visible) {
          if (!model) {
            const loader = new THREE.GLTFLoader();
            loader.load(
              "./scene.gltf",
              function (gltf) {
                model = gltf.scene;
                model.scale.set(0.01, 0.01, 0.01);
                scene.add(model);
                model.position.setFromMatrixPosition(reticle.matrix);
                info.innerText = "WebXR: active\nKamera: aktif\nModel: dimuat ✅";
                notification.style.display = "none";
              },
              undefined,
              function (error) {
                console.error("Gagal memuat model:", error);
                info.innerText = "❌ Gagal memuat model!";
              }
            );
          } else {
            model.position.setFromMatrixPosition(reticle.matrix);
          }
        }
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render(timestamp, frame) {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (!hitTestSourceRequested) {
            session.requestReferenceSpace("viewer").then((referenceSpace) => {
              session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                hitTestSource = source;
              });
            });

            session.addEventListener("end", () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });

            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length) {
              const hit = hitTestResults[0];
              const pose = hit.getPose(referenceSpace);
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
              notification.style.display = "none";
            } else {
              reticle.visible = false;
              notification.style.display = "block";
            }
          }
        }

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
