<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>AR Scene - GLTF Version</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
        background-color: #000;
      }
      #ar-button {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #007bff;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        z-index: 2;
      }
      #ar-button:disabled {
        background: gray;
      }
      #status-box {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border-radius: 8px;
        font-size: 14px;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <button id="ar-button">Masuk ke Mode AR</button>
    <div id="status-box">
      <div>WebXR: <span id="xr-status">cek...</span></div>
      <div>Kamera: <span id="camera-status">cek...</span></div>
      <div>Model: <span id="model-status">belum dimuat</span></div>
    </div>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.158.0/build/three.module.js";
      import { GLTFLoader } from "https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js";

      let camera, scene, renderer, reticle, controller;
      const status = {
        xr: document.getElementById("xr-status"),
        cam: document.getElementById("camera-status"),
        model: document.getElementById("model-status"),
      };

      const arButton = document.getElementById("ar-button");

      // Cek dukungan WebXR
      if (navigator.xr) {
        navigator.xr.isSessionSupported("immersive-ar").then((supported) => {
          if (supported) {
            status.xr.textContent = "didukung ✅";
            arButton.disabled = false;
          } else {
            status.xr.textContent = "tidak didukung ❌";
            arButton.disabled = true;
          }
        });
      } else {
        status.xr.textContent = "tidak tersedia ❌";
        arButton.disabled = true;
      }

      // Fungsi start AR
      arButton.addEventListener("click", async () => {
        try {
          const session = await navigator.xr.requestSession("immersive-ar", {
            requiredFeatures: ["hit-test", "local-floor"],
          });
          startAR(session);
        } catch (e) {
          alert("Gagal memulai AR: " + e.message);
        }
      });

      async function startAR(session) {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType("local-floor");
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera();

        // Pencahayaan
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // Reticle (penanda posisi)
        const ringGeo = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(ringGeo, ringMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // Load model GLTF
        const loader = new GLTFLoader();
        loader.load(
          "./scene.gltf",
          (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.3, 0.3, 0.3);
            model.visible = false;
            scene.add(model);
            status.model.textContent = "berhasil dimuat ✅";

            controller = renderer.xr.getController(0);
            controller.addEventListener("select", () => {
              if (reticle.visible) {
                const clone = model.clone();
                clone.position.setFromMatrixPosition(reticle.matrix);
                clone.visible = true;
                scene.add(clone);
              }
            });
            scene.add(controller);
          },
          (xhr) => {
            status.model.textContent = `memuat... ${((xhr.loaded / xhr.total) * 100).toFixed(0)}%`;
          },
          (err) => {
            status.model.textContent = "gagal memuat ❌";
            console.error(err);
          }
        );

        session.addEventListener("end", () => {
          document.body.removeChild(renderer.domElement);
        });

        renderer.xr.setSession(session);

        const refSpace = await session.requestReferenceSpace("local-floor");
        const viewerSpace = await session.requestReferenceSpace("viewer");
        const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

        status.cam.textContent = "aktif ✅";

        renderer.setAnimationLoop((timestamp, frame) => {
          if (frame) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
              const pose = hitTestResults[0].getPose(refSpace);
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
          renderer.render(scene, camera);
        });
      }
    </script>
  </body>
</html>
