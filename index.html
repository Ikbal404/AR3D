<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>WebAR GLTF Scene</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- THREE.JS + WebXR -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/webxr/ARButton.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: black;
        color: white;
        font-family: monospace;
      }

      #info {
        position: absolute;
        top: 15px;
        left: 15px;
        font-size: 16px;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 14px;
        border-radius: 8px;
      }

      #ar-button {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #007bff;
        color: white;
        border: none;
        padding: 14px 28px;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        font-family: sans-serif;
        box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
        transition: background 0.3s;
      }

      #ar-button:hover {
        background: #0066d4;
      }

      #notification {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        background: rgba(0, 0, 0, 0.8);
        padding: 15px 20px;
        border-radius: 10px;
        font-size: 18px;
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="info">WebXR: cek...<br />Kamera: cek...<br />Model: belum dimuat</div>
    <div id="notification">Menyiapkan AR...</div>

    <button id="ar-button">Masuk ke Mode AR</button>

    <script>
      let camera, scene, renderer, controller;
      let model = null;
      let reticle;

      const info = document.getElementById("info");
      const notification = document.getElementById("notification");
      const arButton = document.getElementById("ar-button");

      // ✅ Inisialisasi dasar
      async function init() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          0.01,
          40
        );

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ✨ Pencahayaan
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
        scene.add(light);

        // 🔹 Reticle (penanda posisi)
        const ringGeo = new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(ringGeo, ringMat);
        reticle.visible = false;
        scene.add(reticle);

        // 🧭 Kontrol AR
        controller = renderer.xr.getController(0);
        controller.addEventListener("select", onSelect);
        scene.add(controller);

        // 🧱 Load GLTF model
        const loader = new THREE.GLTFLoader();
        loader.load(
          "/scene.gltf",
          function (gltf) {
            model = gltf.scene;
            model.scale.set(0.01, 0.01, 0.01); // Sesuaikan ukuran model di sini
            info.innerText = "WebXR: aktif ✅\nKamera: aktif ✅\nModel: dimuat ✅";
          },
          undefined,
          function (error) {
            console.error("❌ Gagal memuat model:", error);
            info.innerText = "WebXR: aktif ✅\nKamera: aktif ✅\nModel: gagal dimuat ❌";
          }
        );

        // 🌐 Tombol AR
        arButton.addEventListener("click", async () => {
          try {
            notification.style.display = "block";
            const session = await navigator.xr.requestSession("immersive-ar", {
              requiredFeatures: ["hit-test", "dom-overlay"],
              optionalFeatures: [],
              domOverlay: { root: document.body },
            });

            renderer.xr.setSession(session);
            notification.style.display = "none";
            session.addEventListener("end", () => {
              arButton.style.display = "block";
            });
            arButton.style.display = "none";

            // Jalankan render loop
            renderer.setAnimationLoop(render);
          } catch (err) {
            alert("❌ Mode AR gagal dimulai: " + err.message);
          }
        });
      }

      function onSelect() {
        if (reticle.visible && model) {
          const clone = model.clone();
          clone.position.setFromMatrixPosition(reticle.matrix);
          scene.add(clone);
        }
      }

      function render(timestamp, frame) {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (!session) return;

          const viewerPose = frame.getViewerPose(referenceSpace);
          if (viewerPose) {
            const view = viewerPose.views[0];
            const hitTestSource = session.requestHitTestSource
              ? session.requestHitTestSource({ space: referenceSpace })
              : null;
            if (hitTestSource) {
              reticle.visible = true;
            }
          }
        }

        renderer.render(scene, camera);
      }

      init();
    </script>
  </body>
</html>
